<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday</title>
<style>
:root{
  --deep:#0a0108; --panel:#1a0a14; --gold:#ffd700; --rose:#ff9ec4;
  --cream:#fff5f8; --line:#2a1a24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:radial-gradient(ellipse at 50% 0%,#1f0a1a 0%,var(--deep) 70%);
  color:var(--cream);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
#app{
  height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px;gap:14px;
  position:relative;z-index:2;
}
header{text-align:center;flex-shrink:0;animation:fadeIn 1.2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
header h1{
  font:italic 400 clamp(30px,5.5vw,52px)/1.1 Georgia,"Times New Roman",serif;
  background:linear-gradient(180deg,var(--gold) 0%,var(--rose) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;letter-spacing:0.02em;margin-bottom:4px;
}
header .sub{
  font-size:11px;letter-spacing:0.35em;text-transform:uppercase;
  color:var(--rose);opacity:0.7;
}
#stage{
  flex:1;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
#cv{
  display:block;image-rendering:pixelated;border-radius:8px;
  max-width:100%;max-height:100%;
  box-shadow:0 0 80px rgba(255,158,196,0.12);
  position:relative;z-index:1;
}
#fx{
  position:absolute;pointer-events:none;z-index:2;
  left:50%;top:50%;transform:translate(-50%,-50%);
  image-rendering:auto;
}
#controls{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  flex-shrink:0;padding:8px 16px;
  background:rgba(26,10,20,0.7);border:1px solid var(--line);
  border-radius:100px;backdrop-filter:blur(12px);
}
.name-input{
  background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--cream);font:inherit;font-style:italic;font-size:15px;
  padding:4px 6px;outline:none;min-width:130px;max-width:170px;
  text-align:center;transition:border-color 0.2s;
}
.name-input:focus{border-bottom-color:var(--rose)}
.name-input::placeholder{color:var(--rose);opacity:0.4}
.btn{
  background:transparent;border:1px solid var(--line);color:var(--cream);
  font:inherit;font-size:13px;padding:7px 14px;border-radius:100px;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
}
.btn:hover{border-color:var(--rose);color:var(--rose);background:rgba(255,158,196,0.08)}
.btn:active{transform:translateY(1px)}
#dropzone{
  position:fixed;inset:0;background:rgba(10,1,8,0.92);
  border:2px dashed var(--rose);display:none;
  align-items:center;justify-content:center;z-index:100;
  font-size:22px;color:var(--rose);font-style:italic;
}
#dropzone.show{display:flex}
#message{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--panel);border:1px solid var(--rose);
  padding:8px 20px;border-radius:100px;color:var(--rose);font-size:12px;
  opacity:0;transition:all 0.3s;pointer-events:none;z-index:50;
}
#message.show{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
@media (max-width:600px){
  #app{padding:12px 10px;gap:10px}
  #controls{padding:6px 12px;gap:8px}
  .btn{padding:6px 12px;font-size:12px}
  .name-input{font-size:13px;min-width:100px}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1 id="greeting">Happy Birthday</h1>
    <div class="sub">make a wish</div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="fx"></canvas>
  </div>

  <div id="controls">
    <input type="text" class="name-input" id="nameInput" placeholder="their name..." maxlength="24">
    <button class="btn" id="uploadBtn">📷 Photo</button>
    <button class="btn" id="cakeBtn">🎂 Cake</button>
  </div>
</div>

<div id="dropzone">Drop a photo here</div>
<div id="message"></div>
<input type="file" id="fileInput" accept="image/*">

<script>
'use strict';

/* -------- utils -------- */
const $ = id => document.getElementById(id);
const clamp = (x,a,b) => x<a?a:x>b?b:x;
const lerp = (a,b,t) => a+(b-a)*t;
const now = () => performance.now();
const DPR = () => window.devicePixelRatio || 1;

function toast(msg){
  const el = $('message');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2000);
}

/* -------- constants -------- */
const CA = 0.5;
const CHARSET = " .'`,:;~+*?%S#&@";
const SPRITE_COLS = 64;
const SPRITE_ROWS = 128;
const MAX_SPRITES = SPRITE_COLS * SPRITE_ROWS;

/* -------- canvases -------- */
const cv = $('cv');
const ctx = cv.getContext('2d', { alpha: false, desynchronized: true });
const fx = $('fx');
const fxCtx = fx.getContext('2d');

/* -------- state -------- */
let S = null;
let src = null;
let lastFrame = now();
let needsCompute = false;
let needsRender = false;

/* -------- confetti -------- */
const confetti = [];
const CONFETTI_COLORS = ['#ffd700','#ff9ec4','#b47cff','#fff5f8','#ff6b9d'];

function initConfetti(){
  for (let i = 0; i < 50; i++){
    confetti.push({
      x: Math.random(),
      y: Math.random() * 1.3 - 0.15,
      vy: 0.03 + Math.random() * 0.08,
      vx: (Math.random() - 0.5) * 0.02,
      w: 3 + Math.random() * 6,
      h: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.15,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    });
  }
}

function updateConfetti(dt){
  for (const c of confetti){
    c.y += c.vy * dt;
    c.x += c.vx * dt;
    c.rot += c.rotV * dt;
    if (c.y > 1.15){ c.y = -0.1; c.x = Math.random(); }
    if (c.x < -0.05) c.x = 1.05;
    if (c.x > 1.05) c.x = -0.05;
  }
}

function renderConfetti(){
  const w = fx.width, h = fx.height;
  fxCtx.clearRect(0, 0, w, h);
  const scale = Math.max(1, w / 800);
  for (const c of confetti){
    fxCtx.save();
    fxCtx.translate(c.x * w, c.y * h);
    fxCtx.rotate(c.rot);
    fxCtx.fillStyle = c.color;
    fxCtx.fillRect(-c.w*scale/2, -c.h*scale/2, c.w*scale, c.h*scale);
    fxCtx.restore();
  }
}

/* -------- blur -------- */
function blur(src, W, H, sigma){
  let a = Float32Array.from(src);
  let b = new Float32Array(src.length);
  const r = Math.max(1, Math.round(sigma * 2));
  const pass = (input, output, horizontal) => {
    const N = horizontal ? W : H;
    const M = horizontal ? H : W;
    const stride = horizontal ? 1 : W;
    const lineStride = horizontal ? W : 1;
    const inv = 1 / (2 * r + 1);
    for (let l = 0; l < M; l++){
      const base = l * lineStride;
      let sum = input[base] * (r + 1);
      for (let i = 1; i <= r; i++) sum += input[base + Math.min(i, N-1) * stride];
      for (let i = 0; i < N; i++){
        output[base + i*stride] = sum * inv;
        sum += input[base + Math.min(N-1, i+r+1) * stride];
        sum -= input[base + Math.max(0, i-r) * stride];
      }
    }
  };
  pass(a,b,true); [a,b]=[b,a];
  pass(a,b,true); [a,b]=[b,a];
  pass(a,b,false);[a,b]=[b,a];
  pass(a,b,false);[a,b]=[b,a];
  return a;
}

/* -------- build scene -------- */
function build(){
  if (!src) return;
  const iw = src.naturalWidth || src.width;
  const ih = src.naturalHeight || src.height;
  const C = 180;
  const R = Math.max(20, Math.round(C * ih / iw * CA));
  const N = C * R;

  const off = document.createElement('canvas');
  off.width = C; off.height = R;
  const oc = off.getContext('2d', { willReadFrequently: true });
  oc.fillStyle = '#000';
  oc.fillRect(0, 0, C, R);
  oc.imageSmoothingQuality = 'high';
  oc.drawImage(src, 0, 0, C, R);
  const data = oc.getImageData(0, 0, C, R).data;

  const rgb = new Float32Array(N * 3);
  const lum = new Float32Array(N);
  for (let i = 0; i < N; i++){
    rgb[i*3] = data[i*4] / 255;
    rgb[i*3+1] = data[i*4+1] / 255;
    rgb[i*3+2] = data[i*4+2] / 255;
    lum[i] = 0.299*rgb[i*3] + 0.587*rgb[i*3+1] + 0.114*rgb[i*3+2];
  }

  const sorted = Array.from(lum).sort((a,b) => a-b);
  const lo = sorted[Math.floor(sorted.length * 0.03)];
  const hi = sorted[Math.floor(sorted.length * 0.995)];
  const span = Math.max(hi - lo, 1e-3);
  const L = new Float32Array(N);
  for (let i = 0; i < N; i++) L[i] = clamp((lum[i] - lo) / span, 0, 1);

  const ch = [new Float32Array(N), new Float32Array(N), new Float32Array(N)];
  for (let i = 0; i < N; i++){
    const m = Math.max(rgb[i*3], rgb[i*3+1], rgb[i*3+2]) + 1e-4;
    ch[0][i] = rgb[i*3] / m;
    ch[1][i] = rgb[i*3+1] / m;
    ch[2][i] = rgb[i*3+2] / m;
  }

  const B = blur(L, C, R, 1.8);

  S = {
    C, R, N, L, B, ch,
    glyphs: [...CHARSET],
    gi: new Uint16Array(N),
    key: new Uint16Array(N),
    pg: new Uint16Array(N).fill(65535),
    pk: new Uint16Array(N).fill(65535),
    sp: new Int32Array(256 * 4096).fill(-1),
    ns: 0,
    cw: 8, chh: 16,
    atlas: null, actx: null,
  };

  needsCompute = true;
  needsRender = true;
  layout();
}

/* -------- layout -------- */
function layout(){
  if (!S) return;
  const stage = $('stage');
  const d = DPR();
  const availW = Math.max(64, stage.clientWidth);
  const availH = Math.max(64, stage.clientHeight);

  const cellW = Math.min(availW / S.C, availH * CA / S.R);
  const cw = Math.max(3, Math.floor(cellW * d));
  const chh = Math.max(4, Math.round(cw / CA));
  S.cw = cw;
  S.chh = chh;

  if (!S.atlas){
    S.atlas = document.createElement('canvas');
    S.actx = S.atlas.getContext('2d');
  }
  S.atlas.width = SPRITE_COLS * cw;
  S.atlas.height = SPRITE_ROWS * chh;
  const a = S.actx;
  a.font = Math.round(chh * 0.9) + 'px ui-monospace, Menlo, Consolas, monospace';
  a.textAlign = 'center';
  a.textBaseline = 'middle';
  S.sp.fill(-1);
  S.ns = 0;
  a.clearRect(0, 0, S.atlas.width, S.atlas.height);
  S.pg.fill(65535);
  S.pk.fill(65535);

  cv.width = S.C * cw;
  cv.height = S.R * chh;
  const fit = Math.min(1, (availW * d) / cv.width, (availH * d) / cv.height);
  cv.style.width = (cv.width * fit / d) + 'px';
  cv.style.height = (cv.height * fit / d) + 'px';
  ctx.imageSmoothingEnabled = false;

  fx.width = cv.width;
  fx.height = cv.height;
  fx.style.width = cv.style.width;
  fx.style.height = cv.style.height;
  fxCtx.imageSmoothingEnabled = false;

  needsRender = true;
}

/* -------- sprite cache -------- */
function sprite(g, key){
  const idx = g * 4096 + key;
  let i = S.sp[idx];
  if (i >= 0) return i;
  if (S.ns >= MAX_SPRITES){
    S.sp.fill(-1);
    S.ns = 0;
    S.actx.clearRect(0, 0, S.atlas.width, S.atlas.height);
  }
  i = S.ns++;
  S.sp[idx] = i;
  const cw = S.cw, chh = S.chh;
  const x = (i % SPRITE_COLS) * cw;
  const y = Math.floor(i / SPRITE_COLS) * chh;
  const a = S.actx;
  a.save();
  a.beginPath();
  a.rect(x, y, cw, chh);
  a.clip();
  a.fillStyle = '#000';
  a.fillRect(x, y, cw, chh);
  if (g){
    const r = ((key >> 8) & 15) * 17;
    const gg = ((key >> 4) & 15) * 17;
    const bb = (key & 15) * 17;
    a.fillStyle = 'rgb(' + r + ',' + gg + ',' + bb + ')';
    a.fillText(S.glyphs[g] || ' ', x + cw/2, y + chh/2 + chh*0.05);
  }
  a.restore();
  return i;
}

/* -------- compute (runs once per source change) -------- */
function compute(){
  const { N, L, B, ch, gi, key } = S;
  const nG = S.glyphs.length;
  for (let i = 0; i < N; i++){
    let Lf = clamp(L[i], 0, 1);
    Lf += B[i] * 0.35;
    Lf = clamp(Lf, 0, 1);

    const g = Math.min(nG - 1, (Lf * nG) | 0);
    const tint = 0.3 + 0.7 * Lf;
    const r0 = ch[0][i] * 255 * tint;
    const g0 = ch[1][i] * 255 * tint;
    const b0 = ch[2][i] * 255 * tint;

    const qr = Math.min(15, Math.max(0, Math.round(r0 / 17)));
    const qg = Math.min(15, Math.max(0, Math.round(g0 / 17)));
    const qb = Math.min(15, Math.max(0, Math.round(b0 / 17)));

    gi[i] = g;
    key[i] = (qr << 8) | (qg << 4) | qb;
  }
  needsCompute = false;
  needsRender = true;
}

/* -------- render (draws only changed cells) -------- */
function render(){
  const { C, R, cw, chh, gi, key, pg, pk, atlas } = S;
  for (let r = 0; r < R; r++){
    const y = r * chh;
    for (let c = 0; c < C; c++){
      const n = r * C + c;
      const g = gi[n];
      const k = g ? key[n] : 0;
      if (g === pg[n] && k === pk[n]) continue;
      pg[n] = g;
      pk[n] = k;
      const i = sprite(g, k);
      const sx = (i % SPRITE_COLS) * cw;
      const sy = Math.floor(i / SPRITE_COLS) * chh;
      ctx.drawImage(atlas, sx, sy, cw, chh, c * cw, y, cw, chh);
    }
  }
  needsRender = false;
}

/* -------- main loop (only confetti animates) -------- */
function frame(ts){
  requestAnimationFrame(frame);
  if (!S) return;

  const dt = Math.min(0.1, (ts - lastFrame) / 1000);
  lastFrame = ts;

  if (needsCompute) compute();
  if (needsRender) render();

  updateConfetti(dt);
  renderConfetti();
}

/* -------- birthday cake (procedural) -------- */
function makeCake(){
  const c = document.createElement('canvas');
  c.width = c.height = 800;
  const g = c.getContext('2d');

  // Background glow
  const bg = g.createRadialGradient(400, 350, 40, 400, 400, 500);
  bg.addColorStop(0, '#2a0a20');
  bg.addColorStop(0.5, '#150812');
  bg.addColorStop(1, '#050008');
  g.fillStyle = bg;
  g.fillRect(0, 0, 800, 800);

  // Plate
  g.fillStyle = '#ffc8dc';
  g.beginPath(); g.ellipse(400, 645, 320, 55, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#ffe8f0';
  g.beginPath(); g.ellipse(400, 640, 320, 55, 0, 0, Math.PI*2); g.fill();

  // Bottom tier
  g.fillStyle = '#f5b3d1';
  g.fillRect(180, 440, 440, 200);
  g.fillStyle = '#fff5f8';
  g.beginPath();
  g.moveTo(180, 440);
  for (let i = 0; i <= 22; i++){
    const x = 180 + i*20;
    const y = 440 + (i%2===0 ? -18 : 0);
    g.lineTo(x, y);
  }
  g.lineTo(620, 440); g.lineTo(620, 470); g.lineTo(180, 470);
  g.closePath(); g.fill();

  // Middle tier
  g.fillStyle = '#e896bb';
  g.fillRect(250, 320, 300, 140);
  g.fillStyle = '#fff5f8';
  g.beginPath();
  g.moveTo(250, 320);
  for (let i = 0; i <= 15; i++){
    const x = 250 + i*20;
    const y = 320 + (i%2===0 ? -16 : 0);
    g.lineTo(x, y);
  }
  g.lineTo(550, 320); g.lineTo(550, 348); g.lineTo(250, 348);
  g.closePath(); g.fill();

  // Top tier
  g.fillStyle = '#d47da8';
  g.fillRect(310, 230, 180, 90);
  g.fillStyle = '#fff5f8';
  g.beginPath();
  g.moveTo(310, 230);
  for (let i = 0; i <= 9; i++){
    const x = 310 + i*20;
    const y = 230 + (i%2===0 ? -14 : 0);
    g.lineTo(x, y);
  }
  g.lineTo(490, 230); g.lineTo(490, 252); g.lineTo(310, 252);
  g.closePath(); g.fill();

  // Candles
  const candleXs = [345, 400, 455];
  for (const cx of candleXs){
    g.fillStyle = '#fff5f8';
    g.fillRect(cx-7, 160, 14, 70);
    g.fillStyle = '#ff6b9d';
    g.fillRect(cx-7, 165, 14, 8);
    g.fillRect(cx-7, 185, 14, 8);
    g.fillRect(cx-7, 205, 14, 8);
    g.fillStyle = '#333';
    g.fillRect(cx-1, 152, 2, 10);
    // Flame glow
    const flame = g.createRadialGradient(cx, 138, 1, cx, 138, 28);
    flame.addColorStop(0, '#fffbe0');
    flame.addColorStop(0.4, '#ffd700');
    flame.addColorStop(0.8, '#ff8800');
    flame.addColorStop(1, 'rgba(255,80,0,0)');
    g.fillStyle = flame;
    g.beginPath(); g.arc(cx, 138, 28, 0, Math.PI*2); g.fill();
    // Flame core
    g.fillStyle = '#fffacd';
    g.beginPath(); g.ellipse(cx, 138, 5, 12, 0, 0, Math.PI*2); g.fill();
  }

  // Sprinkles
  const spr = ['#ffd700','#ff6b9d','#b47cff','#fff5f8','#ff9ec4'];
  for (let i = 0; i < 80; i++){
    const x = 180 + Math.random() * 440;
    const y = 250 + Math.random() * 380;
    g.fillStyle = spr[Math.floor(Math.random() * spr.length)];
    g.fillRect(x, y, 5, 3);
  }

  const im = new Image();
  im.onload = () => setSource(im);
  im.src = c.toDataURL();
}

/* -------- source management -------- */
function setSource(s){
  src = s;
  build();
}

function loadPhoto(file){
  if (!file || !file.type.startsWith('image/')) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => { setSource(im); toast('Looking good'); };
    im.onerror = () => toast('Could not read that image');
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* -------- UI wiring -------- */
function initUI(){
  const nameInput = $('nameInput');
  const greeting = $('greeting');
  nameInput.addEventListener('input', () => {
    const name = nameInput.value.trim();
    greeting.textContent = name ? 'Happy Birthday, ' + name : 'Happy Birthday';
  });

  $('uploadBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => loadPhoto(e.target.files[0]));

  $('cakeBtn').addEventListener('click', () => {
    makeCake();
    toast('🎂');
  });

  const dz = $('dropzone');
  ['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => {
    e.preventDefault();
    dz.classList.add('show');
  }));
  ['dragleave', 'drop'].forEach(ev => addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'drop' && e.dataTransfer.files[0]) loadPhoto(e.dataTransfer.files[0]);
    dz.classList.remove('show');
  }));

  addEventListener('paste', e => {
    for (const item of e.clipboardData.items){
      if (item.type.startsWith('image/')){
        loadPhoto(item.getAsFile());
        break;
      }
    }
  });

  addEventListener('resize', layout);
  addEventListener('orientationchange', () => setTimeout(layout, 100));
}

/* -------- boot -------- */
function init(){
  initUI();
  initConfetti();
  makeCake();
  requestAnimationFrame(frame);
}

window.addEventListener('load', init);
</script>
</body>
</html>
