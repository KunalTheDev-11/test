<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Buildme</title>
<style>
:root{color-scheme:dark;--bg:#060609;--fg:#e8e6ee;--mut:#8a8796;--line:#23212c;--acc:#ff9ebb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060609;--fg:#e8e6ee}}
:root[data-theme="dark"]{--bg:#060609}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.3 ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace}
body{display:flex;flex-direction:column;height:100%}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;background:var(--bg);touch-action:none}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#0a0a10e6;transition:opacity .5s}
button,label.b{background:#14131c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover,label.b:hover{border-color:var(--acc)}button.on{border-color:var(--acc);color:var(--acc)}
.sl{display:flex;align-items:center;gap:6px;color:var(--mut)}input[type=range]{width:110px;accent-color:#ff9ebb}
#drop{position:absolute;inset:8px;border:2px dashed var(--acc);border-radius:12px;display:none;align-items:center;justify-content:center;color:var(--acc);background:#060609cc;font-size:18px}
#info{color:var(--mut)}
body.idle #bar{opacity:0;pointer-events:none}body.idle{cursor:none}
</style></head><body>
<div id="stage"><canvas id="cv"></canvas><div id="drop">Drop an image here</div></div>
<div id="bar">
<label class="b">Open image<input id="file" type="file" accept="image/*" multiple hidden></label>
<button id="replay">Replay</button>
<span class="sl">Resolution <input id="res" type="range" min="80" max="600" step="10" value="240"><b id="rv">240</b></span>
<label class="sl"><input id="auto" type="checkbox" checked>auto quality</label>
<span class="sl">Glow <input id="glow" type="range" min="0" max="200" value="100"></span>
<span class="sl">Brightness <input id="bright" type="range" min="40" max="160" value="100"></span>
<select id="ramp" title="Character set" style="background:#14131c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit"></select>
<button id="pause">Pause</button><button id="fs">Fullscreen</button>
<label class="b">Video<input id="vfile" type="file" accept="video/*" hidden></label><button id="cam">Webcam</button>
<button id="prev">‹</button><button id="next">›</button><label class="sl"><input id="slide" type="checkbox" checked>slideshow</label>
<select id="font" title="Font" style="background:#14131c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit"></select>
<input id="chars" type="text" placeholder="custom chars, dark→light" style="width:150px;background:#14131c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit">
<button id="png" hidden>Save PNG</button><button id="rec" hidden>Record</button>
<span id="info">Drop or paste an image · keys 1–4 palette, E edges, R replay</span>
</div>
<script>
const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
const BG='#060609', CA=0.5;
const GL=[...' .\'`,:;~+*?%S#&@','-','|','/','\\','.','+','*'], G_D=16,G_P=17,G_S=18,G_B=19,G_P0=20;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function lut(st){const o=new Float32Array(768);for(let i=0;i<256;i++){const x=i/255;let j=0;while(j<st.length-2&&x>st[j+1][0])j++;const a=st[j],b=st[j+1],f=Math.min(1,Math.max(0,(x-a[0])/(b[0]-a[0]))),A=hex(a[1]),B=hex(b[1]);for(let c=0;c<3;c++)o[i*3+c]=A[c]+(B[c]-A[c])*f}return o}
const PAL={1:{n:'Original',l:lut([[0,'#000000'],[1,'#ffffff']]),k:.88}};
let pk='1', edges=true, paused=false, pauseAt=0, bright=1, S=null, ema=0, fcount=0, lastAdapt=0, live=false, vid=null, mirror=false, src=null, t0=performance.now(), last=t0, lastDraw=0, glowAmt=1;
const smooth=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
const kern=(s,r)=>{const k=new Float32Array(2*r+1);let n=0;for(let i=-r;i<=r;i++){k[i+r]=Math.exp(-i*i/(2*s*s));n+=k[i+r]}for(let i=0;i<k.length;i++)k[i]/=n;return k};
function boxPass(src,dst,W,H,r,horiz){const n=horiz?W:H,m=horiz?H:W,st=horiz?1:W,ls=horiz?W:1,inv=1/(2*r+1);
 for(let l=0;l<m;l++){const b=l*ls;let s=src[b]*(r+1);for(let i=1;i<=r;i++)s+=src[b+Math.min(i,n-1)*st];
  for(let i=0;i<n;i++){dst[b+i*st]=s*inv;s+=src[b+Math.min(n-1,i+r+1)*st]-src[b+Math.max(0,i-r)*st]}}}
function blur(a,W,H,sx,sy){let s=Float32Array.from(a),t=new Float32Array(a.length);
 for(const[sg,h]of[[sx,true],[sy,false]]){if(sg<=.01)continue;const r=Math.max(1,Math.round((Math.sqrt(4*sg*sg+1)-1)/2));for(let k=0;k<3;k++){boxPass(s,t,W,H,r,h);const q=s;s=t;t=q}}
 return s}
function blurOld(a,W,H,sx,sy){let s=a;
 if(sx>.01){const r=Math.ceil(sx*3),k=kern(sx,r),t=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let i=-r;i<=r;i++){const xx=x+i<0?0:x+i>=W?W-1:x+i;v+=k[i+r]*s[y*W+xx]}t[y*W+x]=v}s=t}
 if(sy>.01){const r=Math.ceil(sy*3),k=kern(sy,r),t=new Float32Array(W*H);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let v=0;for(let i=-r;i<=r;i++){const yy=y+i<0?0:y+i>=H?H-1:y+i;v+=k[i+r]*s[yy*W+x]}t[y*W+x]=v}s=t}
 return s===a?Float32Array.from(a):s}
const pct=(a,p)=>{const s=Float32Array.from(a).sort();return s[Math.min(s.length-1,Math.floor(p/100*s.length))]};

function demo(){const c=document.createElement('canvas');c.width=c.height=900;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,900,900);
 let r=g.createRadialGradient(450,450,20,450,450,330);r.addColorStop(0,'#0a0a0a');r.addColorStop(.18,'#0d3b4c');r.addColorStop(.45,'#1f7a8c');r.addColorStop(.7,'#e09f3e');r.addColorStop(.88,'#7a444a');r.addColorStop(1,'#000');g.fillStyle=r;g.beginPath();g.arc(450,450,330,0,7);g.fill();
 g.strokeStyle='#ffffff55';g.lineWidth=2;for(let i=0;i<90;i++){const a=i/90*6.283;g.beginPath();g.moveTo(450+Math.cos(a)*90,450+Math.sin(a)*90);g.lineTo(450+Math.cos(a+.15)*280,450+Math.sin(a+.15)*280);g.stroke()}
 g.fillStyle='#000';g.beginPath();g.arc(450,450,85,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(390,390,30,0,7);g.fill();g.beginPath();g.arc(500,505,12,0,7);g.fill();return c}

function build(){
 if(!src)return;
 const C=live?Math.min(+$('res').value,200):+$('res').value, iw=src.width||src.naturalWidth||src.videoWidth, ih=src.height||src.naturalHeight||src.videoHeight;
 const R=Math.max(8,Math.round(C*ih/iw*CA)), N=C*R;
 const o=document.createElement('canvas');o.width=C*2;o.height=R*2;const oc=o.getContext('2d',{willReadFrequently:true});
 oc.fillStyle='#000';oc.fillRect(0,0,o.width,o.height);oc.imageSmoothingQuality='high';oc.drawImage(src,0,0,o.width,o.height);
 const d=oc.getImageData(0,0,o.width,o.height).data, rgb=new Float32Array(N*3), lum=new Float32Array(N);
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){let a=0,b=0,c=0;for(let j=0;j<2;j++)for(let i=0;i<2;i++){const p=((y*2+j)*C*2+x*2+i)*4;a+=d[p];b+=d[p+1];c+=d[p+2]}const n=y*C+x;rgb[n*3]=a/1020;rgb[n*3+1]=b/1020;rgb[n*3+2]=c/1020;lum[n]=.299*rgb[n*3]+.587*rgb[n*3+1]+.114*rgb[n*3+2]}
 const lo=pct(lum,3),hi=pct(lum,99.5);let L=new Float32Array(N);for(let i=0;i<N;i++)L[i]=Math.pow(Math.min(1,Math.max(0,(lum[i]-lo)/Math.max(hi-lo,1e-3))),.85);
 // edges
 const Ls=blur(L,C,R,.8/CA,.8),mag=new Float32Array(N),EI=new Uint8Array(N);
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){const n=y*C+x,gx=(Ls[y*C+Math.min(C-1,x+1)]-Ls[y*C+Math.max(0,x-1)])/2,gy=(Ls[Math.min(R-1,y+1)*C+x]-Ls[Math.max(0,y-1)*C+x])/2,gxr=gx/CA;mag[n]=Math.hypot(gxr,gy);let a=Math.atan2(gxr,-gy)%Math.PI;if(a<0)a+=Math.PI;EI[n]=(a<Math.PI/8||a>7*Math.PI/8)?G_D:Math.abs(a-Math.PI/2)<Math.PI/8?G_P:a<Math.PI/2?G_B:G_S}
 const mp=Math.max(pct(mag,96),1e-6),E=new Float32Array(N);for(let i=0;i<N;i++)E[i]=Math.min(1.5,mag[i]/mp);
 // geometry
 const cx=(C-1)/2,cy=(R-1)/2,ext=Math.max(cx*CA,cy,1e-3),dist=new Float32Array(N),u=new Float32Array(N),noise=new Float32Array(N);
 for(let y=0;y<R;y++)for(let x=0;x<C;x++){const n=y*C+x,nx=(x-cx)*CA/ext,ny=(y-cy)/ext;dist[n]=Math.hypot(nx,ny);u[n]=(nx+ny)*.35+.5;noise[n]=.5+.5*(Math.sin(x*.37*240/C*1.0+1.3)+Math.sin(y*.51*240/C+.7)+Math.sin((x+y)*.23*240/C+2.1))/3}
 const Lb=new Float32Array(N),L2=new Float32Array(N);for(let i=0;i<N;i++){const v=1-.62*smooth((dist[i]-.55)/.5);Lb[i]=L[i]*v;L2[i]=Lb[i]*Lb[i]}

 const b1=blur(L2,C,R,2.2*sc/CA,2.2*sc),b2=blur(Lb,C,R,5*sc/CA,5*sc),B=new Float32Array(N);for(let i=0;i<N;i++)B[i]=Math.min(1,1.6*b1[i]+.5*b2[i])*.55;
 // chroma
 const ch=[new Float32Array(N),new Float32Array(N),new Float32Array(N)];
 for(let i=0;i<N;i++){const m=Math.max(rgb[i*3],rgb[i*3+1],rgb[i*3+2])+1e-4,c0=rgb[i*3]/m,c1=rgb[i*3+1]/m,c2=rgb[i*3+2]/m,mn=(c0+c1+c2)/3;ch[0][i]=Math.min(1,Math.max(0,mn+(c0-mn)*1.25));ch[1][i]=Math.min(1,Math.max(0,mn+(c1-mn)*1.25));ch[2][i]=Math.min(1,Math.max(0,mn+(c2-mn)*1.25))}

function layout(){
 if(!S)return;const st=$('stage'),dpr=window.devicePixelRatio||1,aw=st.clientWidth-8,ah=st.clientHeight-8;

 cv.width=S.C*cw;cv.height=S.R*chh;const fit=Math.min(1,aw*dpr/(S.C*cw),ah*dpr/(S.R*chh));cv.style.width=S.C*cw*fit/dpr+'px';cv.style.height=S.R*chh*fit/dpr+'px';ctx.imageSmoothingEnabled=false;
}
function spr(g,key){const k=g<<12|key;let i=S.sp[k];if(i>=0)return i;
 if(S.ns>=8192){S.sp.fill(-1);S.ns=0;S.actx.clearRect(0,0,S.atlas.width,S.atlas.height)}
 i=S.ns++;S.sp[k]=i;const cw=S.cw,chh=S.chh,x=(i&63)*cw,y=(i>>6)*chh,a=S.actx;
 a.save();a.beginPath();a.rect(x,y,cw,chh);a.clip();a.fillStyle=BG;a.fillRect(x,y,cw,chh);
 if(g){a.fillStyle='rgb('+(key>>8&15)*17+','+(key>>4&15)*17+','+(key&15)*17+')';a.fillText(GL[g],x+cw/2,y+chh/2+chh*.04)}
 a.restore();return i}
function resetSprites(){S.sp.fill(-1);S.ns=0;S.actx.clearRect(0,0,S.atlas.width,S.atlas.height);S.pg.fill(255)}
function replay(){t0=performance.now();last=t0;pauseAt=t0;if(S)S.dirty=true}
const SIN=new Float32Array(4096);for(let i=0;i<4096;i++)SIN[i]=Math.sin(i/4096*6.283185307);
const fsin=x=>SIN[(x*651.8986469)&4095];
const IDX=new Uint8Array(256);for(let i=0;i<256;i++)IDX[i]=Math.min(15,Math.floor(Math.pow(i/255,.92)*16));

function frame(now){requestAnimationFrame(frame);if(!S||(paused&&!S.dirty)||now-lastDraw<28)return;lastDraw=now;S.dirty=false;const w0=performance.now();
 const t=((paused?pauseAt:now)-t0)/1000,dt=paused?0:Math.min(.1,(now-last)/1000);if(!paused)last=now;if(live&&!paused&&vid&&vid.readyState>=2)liveUpdate();compute(t,dt);
 const cw=S.cw,chh=S.chh,C=S.C,R=S.R,gi=S.gi,key=S.key,pg=S.pg,pk=S.pk,at=S.atlas;
 for(let r=0;r<R;r++){const y=r*chh;for(let c=0;c<C;c++){const n=r*C+c,g=gi[n],k=g?key[n]:0;if(g===pg[n]&&k===pk[n])continue;pg[n]=g;pk[n]=k;const i=spr(g,k);ctx.drawImage(at,(i&63)*cw,(i>>6)*chh,cw,chh,c*cw,y,cw,chh)}}

}
function compute(t,dt,clean){const{C,R,N,L,B,E,EI,ch,dist,u,noise,gi,key,sx,sy,cx,cy,rowSin,pp,P}=S;
 const pal=PAL[pk],lt=pal.l,k=pal.k,p=smooth(t/4),zoom=clean?1:1+.05*smooth(t/12)+.008*Math.sin(t*.9);

 for(let r=0;r<R;r++){sy[r]=Math.max(0,Math.min(R-1,Math.round((r-cy)/zoom+cy)));rowSin[r]=2*Math.sin(r*.23*130/C*1.0-t*1.1)}

 ptr.a+=((ptr.on?1:0)-ptr.a)*.2;ptr.b*=.93;const R0=C*.05,rr=ptr.b>.02?R0*7:ptr.a>.02?R0*2.2:0,pr0=Math.max(0,Math.floor(ptr.y-rr)),pr1=Math.min(R-1,Math.ceil(ptr.y+rr)),pc0=Math.max(0,Math.floor(ptr.x-rr/CA)),pc1=Math.min(C-1,Math.ceil(ptr.x+rr/CA)),rb=(1-ptr.b)*R0*6;

  gi[n]=g;key[n]=(Math.min(15,(Math.min(255,R_)+8)>>4)<<8)|(Math.min(15,(Math.min(255,G_)+8)>>4)<<4)|Math.min(15,(Math.min(255,B_)+8)>>4)}}
 // particles
 for(let i=0;i<(clean?0:P);i++){pp.y[i]+=pp.v[i]*dt;if(ptr.a>.02){const dx=(pp.x[i]-ptr.x)*CA,dy=pp.y[i]-ptr.y,d2=dx*dx+dy*dy,rp=R0*3;if(d2<rp*rp&&d2>1e-3){const d=Math.sqrt(d2),fp=(1-d/rp)*40*dt*ptr.a;pp.x[i]+=dx/d*fp/CA;pp.y[i]+=dy/d*fp}}pp.x[i]+=Math.sin(t*.8+pp.h[i])*.8*dt;if(pp.y[i]<0){pp.y[i]=R-1;pp.x[i]=Math.random()*C}
  const x=Math.max(0,Math.min(C-1,pp.x[i]|0)),y=Math.max(0,Math.min(R-1,pp.y[i]|0)),n=y*C+x;
  if(gi[n]<2){const b=(.3+.7*(.5+.5*Math.sin(t*3+pp.h[i]*3)))*p,li=Math.min(255,((.45+.5*b)*255)|0)*3,m=.4+.6*b;gi[n]=G_P0+pp.ty[i];
   key[n]=(Math.min(15,(lt[li]*m+8)>>4)<<8)|(Math.min(15,(lt[li+1]*m+8)>>4)<<4)|Math.min(15,(lt[li+2]*m+8)>>4)}}
 
}
function setImg(im){stopLive();src=im;build()}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>setImg(im);im.onerror=()=>$('info').textContent='Couldn’t read that image.';im.src=fr.result};fr.readAsDataURL(file)}
// UI
$('replay').onclick=replay;
